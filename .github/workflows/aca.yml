# Advisory semantic checks (agentic-code-analysis, issue true-line/agentic-code-analysis#6;
# routed per qwts/image-trail#838). Advisory only — findings are informational;
# promotion to --enforce is a separate owner decision. The size ratchet is
# untouched; the contract is conjunctive (ratchet AND semantic checks).
#
# Judge routing policy (owner, 2026-08-18): CI screening spends the Qwen
# token plan (prepaid credits, service pauses at quota — never surprise
# billing). Anthropic is reserved for qualification/adjudication via
# agentic-code-analysis's dispatch-only calibrate workflow; the HF router
# stays the experimentation lane. A depleted plan surfaces as
# judge-unavailable, never as findings.
#
# Per-check model assignment comes from the 2026-08-18 qualification bake-off
# (calibrate runs 32193373281, 32194066092, 32194309317, 32194311744): a
# qualification is a tuple — check + prompt version + fixture suite +
# provider + model — and no single on-plan model qualified for the whole
# suite. Each check below runs on a route that passed its graded exam at the
# required level; the receipts are on the fleet dashboard's qualifications
# page. agent-context-cost and skill-information-architecture have no
# qualified on-plan route and are deliberately absent (tracked in
# true-line/agentic-code-analysis#80). Re-shop before changing a model here: a
# route swap without a passing exam publishes verdicts nothing vouches for.
name: aca
on:
  pull_request:
    # Deliberately NO `synchronize` (overlook lesson, qwts/overlook#1037): a
    # full-suite judgment on a real PR costs millions of reasoning tokens,
    # and judging every push multiplies that by push count. A PR is judged
    # when it becomes reviewable — opened non-draft, reopened, or flipped
    # ready — and again on demand by applying the `aca` label (remove and
    # re-apply to repeat). The label, not the re-run button, is the
    # fresh-head path: a re-run replays the workflow at the run's original
    # head sha, so a revised PR would never get its new delta judged that
    # way. `ready_for_review` is listed explicitly because the defaults
    # omit it.
    types: [opened, reopened, ready_for_review, labeled]
permissions:
  contents: read
# One advisory run per PR; a newer trigger obsoletes the in-flight judgment.
concurrency:
  group: aca-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
# Jobs run on the organisation's own runners: the Linux runner group holds one
# x86-64 runner, the MacOS group one arm64 runner. A fork's pull request and a
# merge-queue run keep a hosted runner, because a pull request controls the
# workflow file it runs and would otherwise execute its own code on the
# organisation's hardware.
jobs:
  policy:
    name: Action Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # This step reaches for `node`, or runs an action that does, so the
      # runtime is installed first, with the same pinned action the rest of
      # the workflow already uses.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: true-line/trueline-agent-ci/.github/actions/ci-policy@8ec38da39c9b43af2181d1f5e5b7e09226c0bfad # zizmor: ignore[stale-action-refs]
        with:
          authorization-only: 'true'

  # A PR past 25 changed files is not judged at all: per-file reasoning
  # across ten checks on a sweeping refactor is the multi-million-token burn
  # measured on overlook (2026-08-19), and "too large to judge economically"
  # is itself the first review finding. The skip is loud, never a silent
  # partial — judging a truncated subset would present a partial verdict as
  # a whole one. `changed_files` comes free with the event.
  over-budget:
    name: aca skipped — diff exceeds judgment budget
    if: >-
      needs.policy.result == 'success'
      && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
      && (github.event.action != 'labeled' || github.event.label.name == 'aca')
      && github.event.pull_request.changed_files > 25
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGED: ${{ github.event.pull_request.changed_files }}
        run: |
          {
            echo "## aca: not judged"
            echo ""
            echo "This PR changes ${CHANGED} files — past the 25-file judgment budget."
            echo "Per-file reasoning across ten checks on a diff this size costs a"
            echo "meaningful fraction of the weekly judge quota, and the size itself"
            echo "is the first review finding. Split the PR, or accept that this"
            echo "change ships without semantic advisory coverage."
          } >> "$GITHUB_STEP_SUMMARY"
  check:
    name: aca ${{ matrix.check }}
    # Draft guard (ci.yml's); `labeled` judges only when the label is `aca`;
    # and the 25-file diff budget above.
    if: >-
      needs.policy.result == 'success'
      && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
      && (github.event.action != 'labeled' || github.event.label.name == 'aca')
      && github.event.pull_request.changed_files <= 25
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # Advisory: every check reports; one check's findings must not silence
      # another's runner. One runner per check keeps wall-clock at the
      # slowest single check instead of the sum of all ten — judge spend is
      # identical, and runner minutes are free on a public repo.
      fail-fast: false
      matrix:
        include:
          - { check: context-footprint, model: qwen3.7-max }
          - { check: failure-posture, model: qwen3.7-max }
          - { check: seam-audit, model: qwen3.7-max }
          - { check: review-readiness, model: qwen3.7-max }
          - { check: test-honesty, model: qwen3.7-max }
          - { check: naming-truth, model: qwen3.7-max }
          - { check: commit-coherence, model: qwen3.8-max }
          - { check: doc-drift, model: qwen3.8-max }
          - { check: agent-rule-conflict, model: deepseek-v4-pro }
          - { check: single-responsibility, model: deepseek-v4-pro }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # merge-base with origin/main needs history
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: true-line/agentic-code-analysis
          # The default GITHUB_TOKEN is scoped to this repository, so a
          # checkout of a sibling private repository 404s. An empty secret
          # falls back to github.token, so this stays backwards compatible.
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
          ref: 60be121a7b27c94c56f85ac61c20ea61ab1d5d0f # main 2026-08-18 (first pin with the qwen adapter); bump deliberately
          path: .aca
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install advisory checker dependencies
        uses: true-line/trueline-agent-ci/.github/actions/bounded-command@8ec38da39c9b43af2181d1f5e5b7e09226c0bfad # zizmor: ignore[stale-action-refs]
        with:
          task: Install advisory checker dependencies
          executable: npm
          arguments-json: '["clean-install"]'
          working-directory: .aca
          timeout-seconds: '600'
          attempts: '2'
          retry-delay-seconds: '5'
      # A pull request can commit a file under .cache/aca whose name matches a
      # real content-addressed verdict. Remove caller-controlled entries before
      # restoring the trusted Actions cache so they cannot suppress a judge
      # call (same guard as playbook-engineering's semantic-ratchet).
      - name: Discard checked-out semantic verdicts
        run: rm -rf -- .cache/aca
      # Per-check cache keys: matrix jobs saving one shared key would race,
      # and the first saver would evict every other check's verdicts.
      - name: Restore semantic verdicts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/aca
          key: aca-${{ matrix.check }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            aca-${{ matrix.check }}-${{ runner.os }}-
            aca-suite-${{ runner.os }}-
      # Exit 78 is the suite saying "nothing in this diff for me" and is not
      # a failure; findings or a judge error turn this check's advisory job
      # red without touching its siblings.
      - name: Run ${{ matrix.check }}
        env:
          ACA_PROVIDER: qwen
          ACA_MODEL: ${{ matrix.model }}
          QWEN_BASE_URL: https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          CHECK: ${{ matrix.check }}
        run: |
          rc=0
          node .aca/src/cli.ts "$CHECK" --base origin/main || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 78 ]; then
            exit "$rc"
          fi
