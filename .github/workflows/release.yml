name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing exact v<package-version> tag to package and release'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Normally started by the tag trigger: version-cut.yml pushes the version tag as
# chores-dumb[bot], so the push emits this run on its own (a GITHUB_TOKEN push
# would emit nothing). The same trigger covers tags pushed by humans;
# workflow_dispatch remains the recovery path for a tag whose release run never
# happened. Every build checks out the tag, never main. Release asset writes
# also use chores-dumb[bot]; GITHUB_TOKEN is a read-only evidence credential,
# not an authorized workflow initiator.
# This workflow packages and publishes GitHub Release assets only. It does not
# merge version PRs or submit to the Chrome Web Store.
permissions: {}

# Jobs run on the organisation's own runners: the Linux runner group holds one
# x86-64 runner, the MacOS group one arm64 runner. A fork's pull request and a
# merge-queue run keep a hosted runner, because a pull request controls the
# workflow file it runs and would otherwise execute its own code on the
# organisation's hardware.
jobs:
  policy:
    name: Action Policy
    runs-on: ${{ fromJSON((github.event_name == 'merge_group' || github.event.pull_request.head.repo.fork) && '["ubuntu-latest"]' || '["self-hosted", "Linux", "X64"]') }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The organisation's Linux runner does not carry Node on its default PATH.
      # This step reaches for `node`, or runs an action that does, so the
      # runtime is installed first, with the same pinned action the rest of
      # the workflow already uses.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: true-line/trueline-agent-ci/.github/actions/ci-policy@87c6b301057992f79a723f63c64624bf40c9d06a # zizmor: ignore[stale-action-refs]
        with:
          authorization-only: 'true'

  release:
    name: Validate and cut release
    needs: policy
    if: needs.policy.result == 'success'
    runs-on: ${{ fromJSON((github.event_name == 'merge_group' || github.event.pull_request.head.repo.fork) && '["ubuntu-latest"]' || '["self-hosted", "Linux", "X64"]') }}
    timeout-minutes: 60
    permissions:
      actions: read # Required to prove exact-commit complete-suite evidence.
      contents: read # Required only by checkout; writes use the App token.
      pull-requests: read # Required to prove the reviewed version-PR head.
    env:
      INTEROP_PHOTOS_ROOT: ${{ github.workspace }}/node_modules/.interop-photos
    steps:
      - name: Mint the chores-dumb token
        id: chores
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CHORES_DUMB_CLIENT_ID }}
          private-key: ${{ secrets.CHORES_DUMB_PRIVATE_KEY }}
          permission-contents: write

      - name: Resolve release tag
        id: release
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          tag="${DISPATCH_TAG:-$GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be stable three-component semver with a v prefix, got $tag." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require tagged source to be on main
        env:
          TAG_NAME: ${{ steps.release.outputs.tag }}
        run: git merge-base --is-ancestor "$(git rev-list -n 1 "$TAG_NAME")" origin/main

      - name: Require exact-commit and reviewed-head CI evidence
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          source_sha=$(git rev-list -n 1 "$TAG_NAME")
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$source_sha&per_page=100" \
            --jq 'first(.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and (.event == "merge_group" or .event == "push") and .conclusion == "success") | .id) // empty')
          if [ -z "$run_id" ]; then
            echo "No successful complete-suite evidence exists for release commit $source_sha." >&2
            exit 1
          fi
          exact_gate=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100" \
            --jq 'any(.jobs[]; .name == "CI" and .conclusion == "success")')
          test "$exact_gate" = true

          pr_number=$(gh api "repos/$GITHUB_REPOSITORY/commits/$source_sha/pulls" \
            --jq 'map(select(.merged_at != null and .base.ref == "main")) | sort_by(.merged_at) | reverse | first | .number // empty')
          if [ -z "$pr_number" ]; then
            echo "Release commit $source_sha is not associated with a merged main PR." >&2
            exit 1
          fi
          pr_head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" --jq '.head.sha')
          ready_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&head_sha=$pr_head&per_page=100" \
            --jq 'first(.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .conclusion == "success") | .id) // empty')
          if [ -z "$ready_run" ]; then
            echo "PR #$pr_number head $pr_head has no successful ready-PR CI evidence." >&2
            exit 1
          fi
          ready_gate=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ready_run/jobs?filter=latest&per_page=100" \
            --jq 'any(.jobs[]; .name == "CI" and .conclusion == "success")')
          test "$ready_gate" = true
          echo "Release evidence: PR #$pr_number head $pr_head; exact source $source_sha; CI runs $ready_run and $run_id."

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        uses: true-line/trueline-agent-ci/.github/actions/bounded-command@87c6b301057992f79a723f63c64624bf40c9d06a # zizmor: ignore[stale-action-refs]
        with:
          task: Install locked release dependencies
          executable: npm
          arguments-json: '["ci"]'
          timeout-seconds: '900'
          attempts: '2'
          retry-delay-seconds: '5'

      # npm ci replaces node_modules, so the pinned evidence checkout must follow it.
      - name: Checkout pinned Overlook acceptance evidence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: true-line/overlook
          # The default GITHUB_TOKEN is scoped to this repository, so a
          # checkout of a sibling private repository 404s. An empty secret
          # falls back to github.token, so this stays backwards compatible.
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
          ref: 723729d50d63af085502e68cc1377c54a85f1595
          path: node_modules/.interop-photos
          persist-credentials: false

      - name: Install Playwright browser
        uses: true-line/trueline-agent-ci/.github/actions/bounded-command@87c6b301057992f79a723f63c64624bf40c9d06a # zizmor: ignore[stale-action-refs]
        with:
          task: Install Playwright Chromium for release validation
          executable: npx
          arguments-json: '["playwright","install","--with-deps","chromium"]'
          timeout-seconds: '600'
          attempts: '2'
          retry-delay-seconds: '5'

      - name: Smoke-test hardened release build
        env:
          PCLOUD_CLIENT_ID: ${{ secrets.PCLOUD_CLIENT_ID }}
        run: npm run test:e2e:release

      - name: Build and package release
        env:
          PCLOUD_CLIENT_ID: ${{ secrets.PCLOUD_CLIENT_ID }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: npm run package:release -- --tag "$RELEASE_TAG"

      - name: Create or refresh GitHub Release assets
        env:
          GH_TOKEN: ${{ steps.chores.outputs.token }}
          TAG_NAME: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --prerelease
            gh release upload "$TAG_NAME" release/*.zip release/*.sha256 --clobber
          else
            gh release create "$TAG_NAME" release/*.zip release/*.sha256 \
              --verify-tag \
              --generate-notes \
              --prerelease \
              --title "Image Trail $TAG_NAME"
          fi
