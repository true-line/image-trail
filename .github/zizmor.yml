rules:
  secrets-outside-env:
    config:
      allow:
        # Read-only credential for the cross-repository checkouts of the pinned
        # sibling repositories (overlook, agentic-code-analysis). The default
        # GITHUB_TOKEN is scoped to this repository, so a checkout of a private
        # sibling 404s; an empty secret falls back to github.token, so the
        # workflow behaves identically until the secret exists.
        - CROSS_REPO_TOKEN
        # Consumed only by the advisory aca judge (contents: read, pull_request
        # from same-repo branches; fork PRs receive no secrets). Prepaid Qwen
        # token-plan key — spend is capped by the plan, service pauses at
        # quota; absence degrades to a one-line notice, never a failure.
        # (ANTHROPIC_API_KEY removed 2026-08-18: CI never bills Anthropic.)
        - QWEN_API_KEY
  unpinned-uses:
    config:
      policies:
        # ENG-0004 requires the shared policy action at an immutable reviewed
        # commit even when that commit has no release tag.
        '*': hash-pin
